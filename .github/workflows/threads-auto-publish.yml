name: Threads Auto Publish

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date in YYYY-MM-DD, default is current UTC date"
        required: false
        type: string
      dry_run:
        description: "Run without publishing"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      post:
        description: "Manual publish target. Example: Threads Post 1. Required when dry_run=false."
        required: false
        type: choice
        options:
          - ""
          - "Threads Post 1"
          - "Threads Post 2"
  schedule:
    # Watcher. Actual posts use randomized times in daily_ops/YYYY-MM-DD/06_posting_schedule.csv.
    # GitHub schedules can be delayed or skipped, so we check several times per hour.
    - cron: "5,20,35,50 * * * *"

concurrency:
  group: threads-auto-publish
  cancel-in-progress: false

jobs:
  threads:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      BOOTSTRAP_WITHOUT_WEEKLY_ANALYSIS: "1"
      TZ: Asia/Tokyo
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve date
        id: date
        shell: bash
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            echo "date=${{ inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate daily ops
        run: node generate_daily_affiliate_ops.mjs "${{ steps.date.outputs.date }}"

      - name: Pre-publish local check
        run: node github_precheck_today.mjs --date "${{ steps.date.outputs.date }}"

      - name: Dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' }}
        run: node publish_social_queue.mjs --date "${{ steps.date.outputs.date }}" --platform Threads --dry-run

      - name: Publish Threads
        if: ${{ github.event_name == 'schedule' }}
        run: node publish_social_queue.mjs --date "${{ steps.date.outputs.date }}" --platform Threads --due-minutes 720

      - name: Require manual post selection
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false' && inputs.post == '' }}
        run: |
          echo "Choose a single post when dry_run=false."
          exit 1

      - name: Publish Threads Now
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false' && inputs.post != '' }}
        run: node publish_social_queue.mjs --date "${{ steps.date.outputs.date }}" --platform Threads --post "${{ inputs.post }}"

      - name: Commit publish state
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          if [ -d published_state ]; then
            git add -A published_state
          fi
          if [ -d daily_ops ]; then
            git add -A daily_ops
          fi
          if [ -n "$(git diff --cached --name-only)" ]; then
            git commit -m "Update Threads publish state [skip ci]"
            git push || (git pull --rebase origin main && git push)
          else
            echo "No publish state changes."
          fi
